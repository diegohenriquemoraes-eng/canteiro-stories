name: Publicar Story

# De 10 em 10 minutos. O horário real de cada Story vem do NOME do arquivo na
# Release `fila` — o cron só pergunta "venceu alguma coisa?".
#
# O disparo agendado do GitHub atrasa e às vezes é engolido quando a fila de
# runners aperta (medido no projeto irmão: um cron de hora em hora entregou 6
# execuções por dia). Por isso a folga de 90 min em `atraso_max_min`: um Story
# de 09:30 sai às 09:37 sem virar problema, em vez de ser pulado.
#
# Execução sem nada devido sai antes de qualquer chamada de API: gasta um
# minuto de runner (ilimitado em repositório público) e zero cota do Instagram.
on:
  schedule:
    # 05/09/2026: o cron do GitHub e' "quando der" — `*/10` entregou 6 execucoes
    # no dia, com buracos de 4 horas, e o story das 16h nao saiu na hora. Em vez
    # de brigar com o agendador, cada disparo ACENDE UM VIGIA que fica acordado
    # 5h50 (teto do job) olhando a fila de minuto em minuto. Os quatro horarios
    # cobrem o dia com sobra: se um atrasar duas horas, o anterior ainda esta vivo.
    - cron: "7 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só listar a fila e o que publicaria"
        type: boolean
        default: false
      render_apenas:
        description: "Baixar e normalizar sem publicar (não precisa de token)"
        type: boolean
        default: false
      vigia:
        description: "Minutos acordado olhando a fila (0 = uma passada só)"
        type: string
        default: "0"
      forcar:
        description: "Ignorar o horário e publicar o primeiro da fila"
        type: boolean
        default: false

concurrency:
  group: canteiro-stories
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    # o vigia fica acordado 350 min; o teto do job precisa de folga sobre isso
    timeout-minutes: 355
    permissions:
      contents: write        # commit do estado + assets das Releases
      issues: write          # o alarme quando a publicação falha

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt

      - name: Pegar o estado mais recente
        run: git pull --rebase --autostash origin main || true

      - name: Publicar o que estiver vencido
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=""
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ "${{ inputs.render_apenas }}" = "true" ] && args="$args --render-apenas"
          [ "${{ inputs.forcar }}" = "true" ] && args="$args --forcar"
          # disparo agendado acende o VIGIA (5h50, o teto do job): e' ele que faz
          # o horario do app valer. Disparo na mao faz uma passada e sai.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            args="$args --vigia 350"
          elif [ -n "${{ inputs.vigia }}" ] && [ "${{ inputs.vigia }}" != "0" ]; then
            args="$args --vigia ${{ inputs.vigia }}"
          fi
          python publicar_story.py $args

      - name: Avisar se a publicação falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sem isto, uma falha de publicação é silenciosa: o story
          # simplesmente não sai e ninguém fica sabendo até alguém abrir o
          # perfil. Issue vira e-mail.
          titulo="Story não foi publicado"
          if gh issue list --state open --search "$titulo in:title" \
               --json number -q '.[0].number' | grep -q .; then
            echo "Já existe issue aberta sobre isso."
            exit 0
          fi
          corpo=$(cat <<TXT
          A execução de $(date -u '+%d/%m %H:%M UTC') falhou ao publicar.

          Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          O que costuma ser, em ordem:

          1. **Token do Instagram vencido ou revogado** — rode Actions →
          Publicar Story → Run workflow → \`dry_run\`: ele diz qual conta o token
          abre. Se reclamar, gere outro no painel da Meta e regrave o secret
          \`IG_ACCESS_TOKEN\`.
          2. **Cota de 100 publicações/24 h estourada** — o \`dry_run\` mostra o
          consumo.
          3. **Arquivo que o Instagram recusou** — o log diz qual.

          A fila NÃO se perde: o que não publicou continua lá e sai na próxima.
          TXT
          )
          gh issue create --title "$titulo" --body "$corpo"

      - name: Guardar o estado (memória entre execuções)
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json publicados.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json publicados.md
            git commit -m "Story publicado (auto)"
            git pull --rebase --autostash origin main
            git push
          else
            echo "Nada publicado nesta execução."
          fi
