name: Testes

# O nome do arquivo é o agendamento: um erro no parser não dá erro nenhum,
# só publica na hora errada. Roda em todo push.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s testes -v
