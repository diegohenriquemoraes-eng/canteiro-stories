<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151a">
<title>Abrindo…</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➡️</text></svg>">
<style>
  :root{ --fundo:#12151a; --carta:#1b1f27; --linha:#2e3542; --texto:#eef1f6;
         --fraco:#98a2b3; --acento:#D8B888; --acento-t:#1a1205; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--texto);min-height:100svh;
    display:grid;place-items:center;padding:24px;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .env{max-width:420px;width:100%;text-align:center}
  h1{font-size:20px;margin:0 0 6px}
  p{color:var(--fraco);font-size:14px;margin:0 0 18px}
  a.b{display:block;padding:15px;border-radius:12px;background:var(--acento);
    color:var(--acento-t);text-decoration:none;font-weight:600;margin-bottom:10px}
  a.sec{background:var(--carta);color:var(--texto);border:1px solid var(--linha)}
</style>
</head>
<body>
<div class="env">
  <h1 id="titulo">Abrindo o Instagram…</h1>
  <p id="sub">Se ele não abrir sozinho, toque no botão.</p>
  <p id="fecha" style="display:none;color:var(--fraco);font-size:13px">Pode fechar esta aba — o app já abriu.</p>
  <a class="b" id="app" href="#">Abrir agora</a>
  <a class="b sec" id="web" href="https://www.instagram.com/" target="_blank" rel="noopener">Abrir no navegador</a>
</div>

<script>
/* Ponte para o app do Instagram. Existe porque o app Canteiro roda dentro de um
   artifact, e de lá um endereço `instagram://` não sai — mas uma página https,
   sim. Aqui o esquema é disparado com folga e, se o app não atender, sobra o
   caminho web. Esquemas conferidos na documentação de deep link do Instagram. */
const DESTINOS = {
  story:  { app:"instagram://story-camera", web:"https://www.instagram.com/",
            titulo:"Abrindo a câmera de Stories", sub:"Monte a arte aí mesmo: fundo, texto e sticker." },
  camera: { app:"instagram://camera", web:"https://www.instagram.com/",
            titulo:"Abrindo a câmera do Instagram", sub:"Grave aqui ou traga o vídeo já pronto da galeria." },
  /* O Reels é gravado e publicado pelo Edits. A Meta não publica esquema nem
     universal link do app (conferido em 05/09/2026), então NÃO dá para abri-lo
     de fora: tentar às cegas só fazia o iOS alertar "endereço inválido" a cada
     tentativa. Aqui o botão avisa e deixa o caminho do Instagram à mão. */
  edits:  { app:"instagram://camera", web:"https://apps.apple.com/app/edits/id6742463895",
            titulo:"Abra o Edits na tela inicial",
            sub:"O iPhone não deixa outro app abrir o Edits. Toque nele no seu celular — o roteiro e o texto da tela já estão copiados.",
            manual:true },
  feed:   { app:"instagram://camera", web:"https://www.instagram.com/",
            titulo:"Abrindo o Instagram para postar", sub:"Selecione os slides na ordem e ponha a música fixa." },
  direct: { app:"instagram://direct-inbox", web:"https://www.instagram.com/direct/inbox/",
            titulo:"Abrindo o Direct", sub:"Responda tudo em áudio — é a regra do método." },
  perfil: { app:"instagram://user?username=vendanaobra", web:"https://www.instagram.com/vendanaobra/",
            titulo:"Abrindo o seu perfil", sub:"É daqui que sai o Turbinar, pelo post que já provou." },
};

const par = new URLSearchParams(location.search);
const d = DESTINOS[par.get("d")] || DESTINOS.story;

document.getElementById("titulo").textContent = d.titulo;
document.getElementById("sub").textContent = d.sub;
document.getElementById("app").href = d.app;
const bWeb = document.getElementById("web");
bWeb.href = d.web;
if (!d.apps) bWeb.hidden = true;   // Instagram é sempre pelo app

/* dispara sozinho; o botão fica para quando o sistema pedir confirmação.
   Com vários candidatos, para na hora em que a página perde o foco — sinal de
   que o app assumiu. */
let vivo = true;
document.addEventListener("visibilitychange", () => { if (document.hidden) vivo = false; });
window.addEventListener("pagehide", () => { vivo = false; });

/* Some sozinha assim que o app assume. Só dá para fechar uma aba que foi aberta
   por script — por isso o app abre esta página com window.open, e não com um
   link comum. Se o navegador recusar, os botões continuam aí. */
function sumir(){
  try { window.close(); } catch(e) {}
  setTimeout(() => {
    if (!document.hidden) return;          // já saiu para o app: nada a fazer
    try { window.close(); } catch(e) {}
  }, 400);
}
document.addEventListener("visibilitychange", () => { if (document.hidden) setTimeout(sumir, 900); });

if (!d.manual) setTimeout(() => { if (vivo) location.href = d.app; }, 60);

if (d.manual){
  document.getElementById("app").textContent = "Abrir a câmera do Instagram";
  document.getElementById("web").textContent = "Não tenho o Edits — instalar";
  document.getElementById("web").hidden = false;
}
</script>
</body>
</html>
